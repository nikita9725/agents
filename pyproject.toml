[project]
name = "etl-agent"
version = "0.1.0"
description = "An ETL diagnostic planning agent with durable PostgreSQL execution"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "langchain>=1,<2",
    "langgraph>=1.2,<2",
    "langsmith>=0.14.11,<1",
    "langchain-openai>=1,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1,<2",
    "dbos>=2,<3",
    "langgraph-checkpoint-postgres>=3,<4",
    "psycopg[binary,pool]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
    "mypy>=1.15,<2",
    "pre-commit>=4,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true
files = ["src", "tests", "examples"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: isolated business logic and node tests",
    "integration: DBOS worker, PostgreSQL and real LLM provider",
    "e2e: durable tasks, streaming, cancellation and crash recovery",
]
